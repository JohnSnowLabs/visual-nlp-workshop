zero_shot_ner_models:
  import: "from sparknlp_jsl.annotator import PretrainedZeroShotNER"
  reference: "zero-shot-models.md"
  purpose: "Stackable zero-shot NER models for configurable PHI detection in pixel OCR text and metadata free-text cleanTag workflows."
  not_for_builder: "Do not pass these names into common pixel builder routes as clinical pipeline names. Use them as stage-level PretrainedZeroShotNER models inside a fitted NER PipelineModel."
  default_for_stacking:
    - zeroshot_ner_deid_subentity_merged_medium
  usage: "Use PretrainedZeroShotNER().pretrained(...) as a one-line pretrained call, keep labels in a separate variable, convert each model output to chunks, and merge chunks with ChunkMergeApproach."
  selection_guide:
    size_axis: "medium vs large is a speed/accuracy tradeoff by general model-size convention; no benchmarked latency or accuracy numbers are documented here, so suggest the user test on their own data if the choice is cost-sensitive."
    family_axis: "subentity_* models tag specific entity types (DOCTOR, PATIENT, CITY, etc.); generic_* models tag broader categories (NAME, LOCATION, CONTACT, ID). merged vs docwise differ in how spans are merged across the document. nonMedical variants add non-clinical PII entities (ACCOUNTNUM, DEVICE, GENDER, IP, PLATE, VIN, etc.) beyond clinical text."
    when_to_prefer:
      default: "zeroshot_ner_deid_subentity_merged_medium (the default) is a balanced starting point for clinical free text."
      broadest_pii_coverage: "Use a subentity_nonMedical variant when the input may contain non-clinical PII such as device IDs, IP addresses, or license plates."
      simple_categories_ok: "Use a generic_* variant when the user only needs broad entity categories, not fine-grained subtypes."
  options:
    zeroshot_ner_deid_subentity_merged_medium:
      code: 'PretrainedZeroShotNER().pretrained("zeroshot_ner_deid_subentity_merged_medium", "en", "clinical/models")'
      model_card: "https://nlp.johnsnowlabs.com/2024/11/27/zeroshot_ner_deid_subentity_merged_medium_en.html"
      entities: [DOCTOR, PATIENT, AGE, DATE, HOSPITAL, CITY, STREET, STATE, COUNTRY, PHONE, IDNUM, EMAIL, ZIP, ORGANIZATION, PROFESSION, USERNAME]
    zeroshot_ner_deid_subentity_merged_large:
      code: 'PretrainedZeroShotNER().pretrained("zeroshot_ner_deid_subentity_merged_large", "en", "clinical/models")'
      model_card: "https://nlp.johnsnowlabs.com/2024/12/17/zeroshot_ner_deid_subentity_merged_large_en.html"
      entities: [DOCTOR, PATIENT, AGE, DATE, HOSPITAL, CITY, STREET, STATE, COUNTRY, PHONE, IDNUM, EMAIL, ZIP, ORGANIZATION, PROFESSION, USERNAME]
    zeroshot_ner_deid_subentity_docwise_medium:
      code: 'PretrainedZeroShotNER().pretrained("zeroshot_ner_deid_subentity_docwise_medium", "en", "clinical/models")'
      model_card: "https://nlp.johnsnowlabs.com/2024/11/28/zeroshot_ner_deid_subentity_docwise_medium_en.html"
      entities: [AGE, CITY, COUNTRY, DATE, DOCTOR, HOSPITAL, IDNUM, ORGANIZATION, PATIENT, PHONE, PROFESSION, STATE, STREET, ZIP]
    zeroshot_ner_deid_subentity_docwise_large:
      code: 'PretrainedZeroShotNER().pretrained("zeroshot_ner_deid_subentity_docwise_large", "en", "clinical/models")'
      model_card: "https://nlp.johnsnowlabs.com/2024/11/29/zeroshot_ner_deid_subentity_docwise_large_en.html"
      entities: [AGE, CITY, COUNTRY, DATE, DOCTOR, HOSPITAL, IDNUM, ORGANIZATION, PATIENT, PHONE, PROFESSION, STATE, STREET, ZIP]
    zeroshot_ner_deid_generic_docwise_medium:
      code: 'PretrainedZeroShotNER().pretrained("zeroshot_ner_deid_generic_docwise_medium", "en", "clinical/models")'
      model_card: "https://nlp.johnsnowlabs.com/2024/11/28/zeroshot_ner_deid_generic_docwise_medium_en.html"
