version: 1

model_policy:
  default_for_dicom_deidentification: "Use GPU and pretrained/model-backed stages unless the user explicitly asks otherwise."
  first_example: "For pixel PHI workflows, show the configurable common pixel builder before custom manual stages."
  pretrained_format: "Keep every pretrained call on one line."
  registry_style: "Prefer structured fields such as family, size, mode, entities, model_card, code, and concise summary. Long use_case text may exist for user-provided descriptions, but summarize it when presenting options."
  selection_guidance: "When the user has not picked a config, or asks which one to use, show the relevant group's selection_guide before defaulting. State only what is documented here (runtime/hardware, entity coverage, naming convention). Never state a specific benchmark number, latency, or accuracy percentage this skill does not have; if the user needs a precise number, tell them to benchmark on their own data instead of inventing one."

clinical_pipeline:
  import: "from sparknlp.pretrained import PretrainedPipeline"
  default: clinical_deidentification_docwise_benchmark_medium
  purpose: "Healthcare NLP PretrainedPipeline inventory used by common pixel builder routes."
  builder_only_note: "Use these with PretrainedPipeline(...) in common pixel builder routes. Some names contain zeroshot, but they are not stackable PretrainedZeroShotNER stages."
  selection_guide:
    size_axis: "optimized < medium < large is a speed/accuracy tradeoff by general model-size convention (smaller = faster/cheaper, larger = slower/heavier). This skill has no benchmarked latency or accuracy numbers for these pipelines; treat this as a general expectation and suggest the user benchmark on their own data if the choice is cost-sensitive."
    mode_axis: "benchmark vs zeroshot vs SingleStage_zeroshot vary mainly in entity coverage, not size — compare each option's use_case entity list below before choosing. SingleStage_zeroshot variants cover the smallest, fixed entity set and run as a single stage."
    when_to_prefer:
      default: "clinical_deidentification_docwise_benchmark_medium (the default) is a balanced starting point for most users."
      broadest_coverage: "Use a benchmark variant (optimized/medium/large) for the widest entity coverage, e.g. LOCATION-OTHER, BIOID, FAX, DEVICE-adjacent fields."
      fewer_entities_ok: "Use a SingleStage_zeroshot variant only when the user is fine with a smaller, fixed entity set and wants the simplest single-stage pipeline."
  options:
    clinical_deidentification_docwise_benchmark_optimized:
      code: 'PretrainedPipeline("clinical_deidentification_docwise_benchmark_optimized", "en", "clinical/models")'
      use_case: "De-identifies PHI from medical texts. Masks and obfuscates LOCATION, CONTACT, PROFESSION, NAME, DATE, AGE, MEDICALRECORD, ORGANIZATION, HEALTHPLAN, DOCTOR, USERNAME, LOCATION-OTHER, URL, DEVICE, CITY, ZIP, STATE, PATIENT, STREET, PHONE, HOSPITAL, EMAIL, IDNUM, BIOID, FAX, LOCATION_OTHER, DLN, SSN, ACCOUNT, PLATE, VIN, LICENSE, and IP entities."
      hardware: gpu_preferred
    clinical_deidentification_docwise_benchmark_medium:
      code: 'PretrainedPipeline("clinical_deidentification_docwise_benchmark_medium", "en", "clinical/models")'
