version: 1

defaults:
  pipeline_id: pixel_phi_builder
  pretrained: true
  hardware: gpu
  visible_text_policy: phi_only
  ocr_accuracy: highest
  final_dicom: true
  intermediate_inspection: false

question_policy:
  ask_few_questions: true
  max_questions_before_default: 3
  ask_only_when:
    unknown_surface: "The user asks for DICOM de-identification but does not say whether metadata, pixel text, encapsulated PDF, or all surfaces need work."
    unknown_metadata_operation: "The user asks about metadata but does not say inspect or de-identify."
    unknown_free_text_metadata_ner: "The user asks to de-identify free-text metadata but does not say whether text-like metadata fields should be processed with NER."
    unknown_visible_text_policy: "The user asks to remove visible text but does not say PHI-only or all detected text."
  safe_defaults:
    unknown_surface: pixel_phi_builder
    unknown_metadata_operation: metadata_inspection
    unknown_free_text_metadata_ner: metadata_clean_tag_ner
    unknown_visible_text_policy: pixel_phi_builder

checkpoint_policy:
  metadata_compare:
    apply_to: "Every route that outputs both metadata_original and metadata_cleaned."
    required_routes: [metadata_deid, metadata_clean_tag_ner, pixel_phi_builder]
    skip_routes: [metadata_inspection]
    skip_reason: "metadata_inspection only extracts metadata_original, so there is no cleaned metadata column to compare."

multi_frame_optimization_policy:
  applies_to: "Any route whose stages include both DicomToImageV3 and DicomDrawRegions: pixel_phi_builder, pixel_phi_zero_shot, pixel_remove_all_text."
  trigger: "The user states or implies their DICOM files have many/lots of frames, are multi-frame, or reports memory exhaustion/OOM while extracting frames with DicomToImageV3."
  action: "Wrap the assembled PipelineModel with DicomPretrainedPipeline(pipeline) from sparkocr.pretrained and call .transform(dicom_df) on that wrapper in place of pipeline.transform(dicom_df). Keep the rest of the route template unchanged."
  requires: "The pipeline must also contain PositionFinder or a stage named ImageTextDetector so DicomPretrainedPipeline can detect the region column to aggregate."
  reference: "references/stages.md DicomPretrainedPipeline section for the mechanism, the keep_all_cols option, and the caveat that a stage reading a column other than DicomDrawRegions's direct output is silently dropped from the wrapped pipeline."

pipelines:
  metadata_inspection:
    use_when:
      - "see metadata"
      - "show metadata"
      - "inspect metadata"
      - "extract metadata"
      - "look at metadata"
    description: "Extract DICOM metadata into metadata_original; no de-identification."
    pretrained: false
    hardware: none
    stages: [DicomToMetadata]
    template: metadata_inspection
    template_file: template-metadata.md
    models: []
    strategies: []
    checkpoints: [dicom_dataframe_loaded, input_cols_single_line, metadata_column_exists]

  metadata_deid:
    use_when:
      - "metadata de-identification"
      - "de-identify metadata"
      - "anonymize metadata"
      - "structured DICOM tags"
    description: "De-identify structured metadata using deterministic tag and optional group strategies."
    pretrained: false
    hardware: none
    stages: [DicomToMetadata, DicomMetadataDeidentifier, DicomToMetadata]
    template: metadata_deid
    template_file: template-metadata.md
    models: []
    strategies: [tag_strategy, group_strategy_optional]
    checkpoints: [dicom_dataframe_loaded, input_cols_single_line, strategy_csv_written, metadata_compare, final_dicom_column_exists, dicom_display, dicom_save_suggested]

  metadata_strategy_file:
    use_when:
      - "create strategy file"
      - "build strategy file"
      - "strategy file template"
      - "metadata strategy file"
      - "which metadata actions"
      - "tags vr name"
      - "map tags to actions"
      - "choose actions for tags"
      - "tags file"
      - "metadata tags list"
      - "dicom tags table"
      - "unclean tags"
      - "replaceWithMapping strategy"
      - "group strategy"
    description: "Create copy-ready metadata strategy CSV files without building a full DICOM pipeline."
    pretrained: false
    hardware: none
    stages: [DicomMetadataDeidentifier]
    template: metadata_strategy_file
    template_file: template-strategy-file.md
    models: []
    strategies: [tag_strategy, cleanTag_optional, replaceWithMapping_optional, group_strategy_optional]
    checkpoints: [input_cols_single_line, strategy_csv_written]

  metadata_clean_tag_ner:
    use_when:
      - "cleanTag"
      - "free-text metadata"
      - "metadata NER"
      - "study description PHI"
      - "comments PHI"
      - "protocol name PHI"
      - "zero-shot metadata"
      - "stacked metadata NER"
      - "configurable metadata entities"
      - "metadata cleanTag zero-shot"
    description: "De-identify free-text metadata fields using cleanTag plus stackable PretrainedZeroShotNER stages."
    pretrained: true
    hardware: gpu
    stages: [DicomToMetadata, PretrainedZeroShotNER, DeIdentification, DicomMetadataDeidentifier, DicomToMetadata]
    template: metadata_clean_tag_ner
    template_file: template-zero-shot.md
    models: [zero_shot_ner_models]
    ner_strategy:
      default: zero_shot_metadata_stack
      do_not_mix_by_default: true
    strategies: [tag_strategy, cleanTag, group_strategy_optional]
    checkpoints: [dicom_dataframe_loaded, input_cols_single_line, strategy_csv_written, metadata_clean_tag_columns, metadata_compare, final_dicom_column_exists, dicom_display, dicom_save_suggested]

  pixel_phi_builder:
    use_when:
      - "pixel PHI"
      - "burned-in text"
      - "visible PHI"
      - "best accuracy"
      - "VLM"
      - "DICOM pixel de-identification"
      - "default"
    description: "Default configurable GPU/pretrained path for DICOM burned-in PHI."
    pretrained: true
    hardware: gpu
    stages: [DicomToImageV3, MedicalVisionLLM, DocumentCoordinatesToText, HealthcareNLP, PositionFinder, DicomDrawRegions, DicomMetadataDeidentifier, DicomToMetadata]
    template: pixel_phi_builder
    template_file: template-pixel-builder.md
    models: [clinical_pipeline, ocr_engine]
    ner_strategy:
      default: clinical_pipeline_builder
      do_not_mix_by_default: true
    builder_output_rule: "Always output the complete builder code from template-pixel-builder.md, including helper builders, nlp_builder, dicom_pipeline_builder, config, model loading, transform call, and optional inspection pass when relevant. Do not output only the dicom_pipeline_builder(...) call-site."
    dicom_draw_regions_rule: "DicomDrawRegions is an aggregation stage. Use a separate inspection pipeline that stops before DicomDrawRegions for text/coordinates; after DicomDrawRegions, use display_dicom unless selecting outputs from later stages such as DicomMetadataDeidentifier or DicomToMetadata."
    strategies: [tag_strategy_optional]
    checkpoints: [dicom_dataframe_loaded, input_cols_single_line, strategy_csv_written, builder_code_displayed, builder_loads_clinical_pipeline, image_extraction_vlm_compress_policy, medical_vlm_full_parameter_block, intermediate_pixel_columns, metadata_compare, final_dicom_column_exists, dicom_display, dicom_save_suggested, multi_frame_memory_optimization]

  pixel_phi_zero_shot:
    use_when:
      - "pixel zero-shot"
      - "stacked pixel NER"
      - "configurable pixel entities"
      - "burned-in text zero-shot"
    description: "De-identify burned-in pixel PHI using OCR plus stackable PretrainedZeroShotNER stages; do not use the DICOM pipeline builder."
    pretrained: true
    hardware: gpu
    stages: [DicomToImageV3, MedicalVisionLLM, DocumentCoordinatesToText, PretrainedZeroShotNER, PositionFinder, DicomDrawRegions]
    template: pixel_phi_zero_shot
    template_file: template-zero-shot.md
    models: [ocr_engine, zero_shot_ner_models]
    ner_strategy:
      default: zero_shot_stack
      do_not_mix_by_default: true
    dicom_draw_regions_rule: "DicomDrawRegions is an aggregation stage. Use a separate inspection pipeline that stops before DicomDrawRegions for text/coordinates; after DicomDrawRegions, use display_dicom unless selecting outputs from later stages."
    strategies: []
    checkpoints: [dicom_dataframe_loaded, input_cols_single_line, image_extraction_vlm_compress_policy, medical_vlm_full_parameter_block, final_dicom_column_exists, dicom_display, dicom_save_suggested, multi_frame_memory_optimization]

  pixel_remove_all_text:
    use_when:
      - "remove all text"
      - "blanket redaction"
      - "all detected text"
      - "aggressive pixel redaction"
    description: "Remove all detected visible text from DICOM pixels without OCR or NER."
    pretrained: true
    hardware: gpu
    stages: [DicomToImageV3, ImageTextDetector_or_ImageTextDetectorV2, DicomDrawRegions]
    template: pixel_remove_all_text
    template_file: template-pixel-blanket.md
    models: [text_detector]
    configurable:
      text_detector: [ImageTextDetector, ImageTextDetectorV2]
      default_text_detector: ImageTextDetector
      use_gpu: true
      score_threshold: 0.5
      text_threshold: 0.2
      size_threshold: 10
      with_refiner: true
      link_threshold: 0.5
      scale: 1.0
      frame_sampling: 5
      frame_sampling_strategy: CONSECUTIVE
      compression_mode: disabled
      compression_quality: 80
      memory_optimized: false
      text_regions_col: text_regions
      final_dicom_col: dicom_pixel_cleaned
    dicom_draw_regions_rule: "DicomDrawRegions is an aggregation stage. Use a separate inspection pipeline that stops before DicomDrawRegions for text_regions; after DicomDrawRegions, use display_dicom on dicom_pixel_cleaned."
    strategies: []
    checkpoints: [dicom_dataframe_loaded, input_cols_single_line, image_extraction_vlm_compress_policy, final_dicom_column_exists, dicom_display, dicom_save_suggested, multi_frame_memory_optimization]

  encapsulated_pdf_phi_vlm:
    use_when:
      - "encapsulated PDF"
      - "PDF inside DICOM"
      - "document packet"
      - "DICOM PDF"
    description: "De-identify visible PHI inside encapsulated PDFs using DICOM to PDF, PDF to image, VLM OCR, redaction, PDF rebuild, and DICOM update."
    pretrained: true
    hardware: gpu
    stages: [DicomToPdf, PdfToImage, MedicalVisionLLM, DocumentCoordinatesToText, PretrainedZeroShotNER, PositionFinder, ImageSchemaConverter, ImageDrawRegions, ImageToPdf, DicomUpdatePdf]
    template: encapsulated_pdf_phi_vlm
    template_file: template-encapsulated-pdf.md
    models: [zero_shot_ner_models, ocr_engine]
    ner_strategy:
      default: zero_shot_stack
      helper: build_stacked_zero_shot_ner_pipeline
      do_not_mix_by_default: true
    strategies: []
    checkpoints: [dicom_dataframe_loaded, input_cols_single_line, image_extraction_vlm_compress_policy, medical_vlm_full_parameter_block, pdf_intermediate_pass, pdf_coordinates_exist, final_dicom_column_exists, dicom_display, dicom_save_suggested]

  pretrained_dicom_baseline:
    use_when:
      - "pretrained DICOM pipeline"
      - "quick baseline"
      - "fast demo"
      - "Spark OCR pretrained"
    description: "Fast Spark OCR pretrained baseline; use before custom code when the user asks for the easiest path."
    pretrained: true
    hardware: gpu
    stages: [SparkOCRPretrainedPipeline]
    template: pretrained_dicom_baseline
    template_file: template-pretrained.md
    models: [spark_ocr_pretrained_pipeline]
    strategies: []
    checkpoints: [dicom_dataframe_loaded, input_cols_single_line, final_dicom_column_exists, dicom_display, dicom_save_suggested]
