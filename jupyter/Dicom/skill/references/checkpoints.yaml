version: 1

checkpoints:
  dicom_dataframe_loaded:
    check: 'Generated code defines dicom_path and loads dicom_df with spark.read.format("binaryFile").load(dicom_path) before transform.'

  input_cols_single_line:
    check: 'Every .setInputCols(...) call is on a single line; never write .setInputCols([ on one line and the column names on later lines.'

  strategy_csv_written:
    check: 'Generated code writes strategy_file_path, group_strategy_file_path, cleanTag, or replaceWithMapping CSV content to disk with textwrap.dedent before passing the path to DicomMetadataDeidentifier or DicomToMetadata.'

  metadata_column_exists:
    check: "Result has metadata_original and uses build_metadata_df(result, metadata_col=\"metadata_original\") for single-column metadata inspection."

  metadata_compare:
    check: "Use build_metadata_comparison_df(result) to compare metadata_original and metadata_cleaned before saving outputs."

  metadata_clean_tag_columns:
    check: "Result includes tag_mapping, tag_text, deid_documents, and dicom_metadata_cleaned."

  builder_loads_clinical_pipeline:
    check: "Builder can find LightDeIdentification or DeIdentification and ChunkMergeModel inside the selected clinical PretrainedPipeline."

  builder_code_displayed:
    check: "For pixel_phi_builder, the answer includes the complete builder code: ocr_vlm_pipeline_builder, ocr_non_vlm_pipeline_builder, nlp_builder, dicom_pipeline_builder, config, PretrainedPipeline loading, transform call, and optional inspection pass when relevant."

  intermediate_pixel_columns:
    check: "Use an inspection pipeline that stops before DicomDrawRegions; output includes text and coordinates only before DicomDrawRegions aggregation."

  image_extraction_vlm_compress_policy:
    check: 'When VLM is used for OCR, image extraction/handling uses setCompressImage(True) plus frame_dims: BinaryToImage/PdfToImage use setImageDimsCol("frame_dims") and DicomToImageV3 uses setFrameDimsCol("frame_dims"). When VLM is not used, image extraction uses setCompressImage(False).'

  medical_vlm_full_parameter_block:
    check: "Every MedicalVisionLLM stage uses the full canonical block: setNGpuLayers(99), setNCtx(32768), setNParallel(1), setNBatch(2048), setNUbatch(1024), setNPredict(1024), setTemperature(0.01), setTopK(1), setTopP(1.0), setRepeatPenalty(1.03), setRepeatLastN(256), setMinKeep(0), setNProbs(0), setBatchSize(1), and setDisableLog(False)."

  text_regions_exist:
    check: "Detector output includes text_regions before DicomDrawRegions."

  pdf_intermediate_pass:
    check: "Run an intermediate pass before final PDF reconstruction if the user wants to inspect pages, OCR text, or regions."

  pdf_coordinates_exist:
    check: "PDF workflow produces coordinates before ImageDrawRegions."

  final_dicom_column_exists:
    check: "Result includes a final DICOM bytes column: dicom_metadata_cleaned, dicom_pixel_cleaned, or dicom. If DicomDrawRegions is the final stage, validate with display_dicom instead of selecting upstream intermediate columns."

  dicom_display:
    check: 'Use display_dicom(df=result, fields="<final_dicom_col>", limit=1, width=300).'

  dicom_save_suggested:
    check: 'For every final DICOM-producing workflow except metadata_inspection, include the simple save_dicom_to_disk utility function body before calling save_dicom_to_disk(result, dicom_col="<final_dicom_col>", output_dir="/tmp/dicom_deid"). The utility should only create the save directory if needed, extract DICOM bytes, keep the same base filename from path, save to disk, and return saved paths.'
