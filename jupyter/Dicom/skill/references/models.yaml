ocr_engine:
  default: VLM
  options:
    VLM:
      code: 'MedicalVisionLLM.pretrained("jsl-ocr-gguf-vlm1", "en", "clinical/ocr")'
      runtime: "CPU/GPU; GPU recommended"
      use_case: "Highest-accuracy OCR for DICOM images and encapsulated PDF pages."
      output_stage: "DocumentCoordinatesToText produces text, positions, and regions."
      required_params: [setNGpuLayers(99), setNCtx(32768), setNParallel(1), setNBatch(2048), setNUbatch(1024), setNPredict(1024), setTemperature(0.01), setTopK(1), setTopP(1.0), setRepeatPenalty(1.03), setRepeatLastN(256), setMinKeep(0), setNProbs(0), setBatchSize(1), setDisableLog(False)]
    V2:
      detector: 'ImageTextDetector.pretrained("image_text_detector_mem_opt", "en", "clinical/ocr")'
      recognizer: 'ImageToTextV2.pretrained("ocr_large_printed_v2_opt", "en", "clinical/ocr")'
      runtime: "CPU/GPU"
      use_case: "Cheaper printed-text OCR path."
    V3:
      detector: 'ImageTextDetector.pretrained("image_text_detector_mem_opt", "en", "clinical/ocr")'
      recognizer: "ImageToTextV3()"
      runtime: "CPU only recognizer; detector can run CPU/GPU"
      use_case: "Cheaper CPU-only OCR recognizer path."

text_detector:
  default: image_text_detector_mem_opt
  allowed_for_blanket_redaction: [ImageTextDetector, ImageTextDetectorV2]
  selection_key: text_detector
  selection_values:
    ImageTextDetector: "Default Scala-based pretrained detector."
    ImageTextDetectorV2: "Python-based detector alternative."
  defaults:
    input_col: image
    output_col: text_regions
    use_gpu: true
    score_threshold: 0.5
    text_threshold: 0.2
    size_threshold: 10
    with_refiner: true
  options:
    image_text_detector_mem_opt:
      code: 'ImageTextDetector.pretrained("image_text_detector_mem_opt", "en", "clinical/ocr")'
      runtime: "CPU/GPU"
      use_case: "Scala-based text detection only; feeds ImageToTextV2/ImageToTextV3 or blanket text redaction."
    ImageTextDetectorV2:
      code: 'ImageTextDetectorV2.pretrained("image_text_detector_v2", "en", "clinical/ocr")'
      runtime: "CPU/GPU"
      use_case: "Python-based text detection only; can feed ImageToTextV2/ImageToTextV3."

spark_ocr_pretrained_pipeline:
  import: "from sparkocr.pretrained import PretrainedPipeline"
  default: dicom_deid_generic_augmented_minimal
  purpose: "Fast DICOM/PDF/image pretrained baselines from Spark OCR."
  options:
    dicom_deid_generic_augmented_minimal:
      code: 'PretrainedPipeline("dicom_deid_generic_augmented_minimal", "en", "clinical/ocr")'
      use_case: "Least intrusive DICOM de-identification. Removes only the most critical personal identifiers while preserving as much metadata as possible. Strips PHI from both image and metadata while keeping non-sensitive details intact for research and analysis. Minimal removal eliminates only PII from images and the most essential metadata fields while keeping most DICOM tags untouched."
    dicom_deid_full_anonymization:
      code: 'PretrainedPipeline("dicom_deid_full_anonymization", "en", "clinical/ocr")'
      use_case: "Highest level of anonymization. Completely removes all text from both image and metadata. Ideal for preparing DICOM files for public sharing, research, or regulatory compliance when no traceable information should remain. Comprehensive removal eliminates all visible text within images and removes or anonymizes most metadata fields, including patient identifiers, physician details, and hospital information."
    dicom_deid_generic_augmented_pseudonym:
      code: 'PretrainedPipeline("dicom_deid_generic_augmented_pseudonym", "en", "clinical/ocr")'
      use_case: "Anonymizes DICOM metadata by replacing personal identifiers with pseudonyms instead of removing them. Ensures PHI is no longer traceable while maintaining data integrity for longitudinal studies and collaborations. Obfuscation mode removes PII from images and replaces sensitive metadata values, such as patient names and IDs, with randomized or pseudonymized data, preserving metadata structure and usability."
