      model_card: "https://nlp.johnsnowlabs.com/2024/11/29/zeroshot_ner_deid_subentity_docwise_large_en.html"
      entities: [AGE, CITY, COUNTRY, DATE, DOCTOR, HOSPITAL, IDNUM, ORGANIZATION, PATIENT, PHONE, PROFESSION, STATE, STREET, ZIP]
    zeroshot_ner_deid_generic_docwise_medium:
      code: 'PretrainedZeroShotNER().pretrained("zeroshot_ner_deid_generic_docwise_medium", "en", "clinical/models")'
      model_card: "https://nlp.johnsnowlabs.com/2024/11/28/zeroshot_ner_deid_generic_docwise_medium_en.html"
      entities: [AGE, CONTACT, DATE, ID, LOCATION, NAME, PROFESSION]
    zeroshot_ner_deid_generic_docwise_large:
      code: 'PretrainedZeroShotNER().pretrained("zeroshot_ner_deid_generic_docwise_large", "en", "clinical/models")'
      model_card: "https://nlp.johnsnowlabs.com/2024/11/28/zeroshot_ner_deid_generic_docwise_large_en.html"
      entities: [AGE, CONTACT, DATE, ID, LOCATION, NAME, PROFESSION]
    zeroshot_ner_deid_generic_nonMedical_medium:
